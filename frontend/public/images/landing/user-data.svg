<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg1)"/>
  
  <!-- Subtle Gym Grid Backing -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Background Atmospheric Glows -->
  <circle cx="400" cy="225" r="180" fill="#7C3AED" opacity="0.15" filter="url(#glow)"/>
  <circle cx="600" cy="150" r="120" fill="#06B6D4" opacity="0.1" filter="url(#glow)"/>

  <!-- Smartwatch Body & Wrist Representation -->
  <!-- Arm Silhouette -->
  <path d="M 150 450 C 220 380, 300 320, 480 250 C 580 210, 680 180, 800 160" fill="none" stroke="#262E40" stroke-width="110" stroke-linecap="round"/>
  <path d="M 150 450 C 220 380, 300 320, 480 250 C 580 210, 680 180, 800 160" fill="none" stroke="#333E54" stroke-width="95" stroke-linecap="round"/>

  <!-- Smartwatch Band -->
  <rect x="360" y="190" width="80" height="150" rx="12" fill="#111827" stroke="#374151" stroke-width="3" transform="rotate(-25 400 265)"/>
  
  <!-- Smartwatch Dial / Frame -->
  <rect x="340" y="200" width="120" height="130" rx="28" fill="#0F172A" stroke="url(#purpleGrad)" stroke-width="4" filter="url(#glow)" transform="rotate(-25 400 265)"/>

  <!-- Smartwatch Screen Content -->
  <g transform="rotate(-25 400 265)">
    <!-- Screen Header -->
    <text x="400" y="232" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#A855F7" text-anchor="middle" letter-spacing="1">FITMIND SYNC</text>
    
    <!-- Heart Rate Meter -->
    <path d="M 360 255 Q 375 240, 390 255 T 420 255" fill="none" stroke="#F43F5E" stroke-width="3" stroke-linecap="round"/>
    <text x="400" y="278" font-family="Inter, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">142 <tspan font-size="11" font-weight="600" fill="#F43F5E">BPM</tspan></text>
    
    <!-- Progress Ring Mini -->
    <circle cx="400" cy="305" r="16" fill="none" stroke="#1E293B" stroke-width="4"/>
    <circle cx="400" cy="305" r="16" fill="none" stroke="url(#purpleGrad)" stroke-width="4" stroke-dasharray="100" stroke-dashoffset="30"/>
    <text x="400" y="309" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#34D399" text-anchor="middle">85%</text>
  </g>

  <!-- Metric Overlay Cards Floating in Environment -->
  <!-- Card 1: Volume Metric -->
  <g transform="translate(100, 80)">
    <rect width="180" height="75" rx="16" fill="rgba(19, 25, 38, 0.85)" stroke="rgba(124, 58, 237, 0.4)" stroke-width="1.5"/>
    <circle cx="35" cy="37" r="16" fill="#7C3AED" opacity="0.2"/>
    <path d="M 30 42 L 35 32 L 40 42 Z" fill="#A855F7"/>
    <text x="65" y="32" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">TOTAL VOLUME</text>
    <text x="65" y="52" font-family="Inter, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">12,450 <tspan font-size="11" fill="#A855F7">KG</tspan></text>
  </g>

  <!-- Card 2: Workout Time -->
  <g transform="translate(530, 270)">
    <rect width="190" height="75" rx="16" fill="rgba(19, 25, 38, 0.85)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5"/>
    <circle cx="35" cy="37" r="16" fill="#06B6D4" opacity="0.2"/>
    <circle cx="35" cy="37" r="8" fill="none" stroke="#06B6D4" stroke-width="2"/>
    <text x="65" y="32" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">ACTIVE DURATION</text>
    <text x="65" y="52" font-family="Inter, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">54m 20s</text>
  </g>

  <!-- Title Badge Overlay at bottom -->
  <rect x="280" y="390" width="240" height="36" rx="18" fill="rgba(124, 58, 237, 0.2)" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="400" y="413" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">USER DATA METRICS</text>
</svg>
