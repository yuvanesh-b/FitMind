<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg2)"/>
  <circle cx="400" cy="225" r="200" fill="#38BDF8" opacity="0.1" filter="url(#glow2)"/>

  <!-- Analytics Line Graph HUD -->
  <path d="M 100 320 L 220 280 L 340 310 L 460 210 L 580 230 L 700 130" fill="none" stroke="url(#blueGrad)" stroke-width="5" filter="url(#glow2)"/>
  
  <!-- Graph Nodes -->
  <circle cx="220" cy="280" r="7" fill="#38BDF8"/>
  <circle cx="460" cy="210" r="7" fill="#38BDF8"/>
  <circle cx="700" cy="130" r="9" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" filter="url(#glow2)"/>

  <!-- AI Brain / Analysis HUD Center Container -->
  <rect x="260" y="90" width="280" height="180" rx="20" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>
  <text x="400" y="130" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#38BDF8" text-anchor="middle" letter-spacing="1">PROGRESSIVE OVERLOAD AI</text>
  
  <!-- Progress Bars -->
  <rect x="300" y="160" width="200" height="10" rx="5" fill="#1E293B"/>
  <rect x="300" y="160" width="165" height="10" rx="5" fill="url(#blueGrad)"/>

  <rect x="300" y="195" width="200" height="10" rx="5" fill="#1E293B"/>
  <rect x="300" y="195" width="185" height="10" rx="5" fill="#A855F7"/>

  <text x="400" y="235" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0" text-anchor="middle">OPTIMAL RECOVERY: 94%</text>

  <!-- Title Badge Overlay at bottom -->
  <rect x="280" y="390" width="240" height="36" rx="18" fill="rgba(56, 189, 248, 0.2)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="400" y="413" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">AI ANALYSIS ENGINE</text>
</svg>
