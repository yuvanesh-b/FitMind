<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg4)"/>

  <!-- Barbell / Strength Icon Graphic -->
  <g transform="translate(400, 200)">
    <!-- Barbell Bar -->
    <rect x="-180" y="-8" width="360" height="16" rx="8" fill="#94A3B8"/>
    <!-- Outer Plates -->
    <rect x="-160" y="-60" width="30" height="120" rx="8" fill="#10B981"/>
    <rect x="-125" y="-45" width="20" height="90" rx="6" fill="#047857"/>
    
    <rect x="130" y="-60" width="30" height="120" rx="8" fill="#10B981"/>
    <rect x="105" y="-45" width="20" height="90" rx="6" fill="#047857"/>
  </g>

  <!-- Performance Arrow Badge -->
  <path d="M 280 290 L 400 240 L 520 290" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Title Badge Overlay at bottom -->
  <rect x="280" y="390" width="240" height="36" rx="18" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="1.5"/>
  <text x="400" y="413" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">BETTER TRAINING RESULTS</text>
</svg>
